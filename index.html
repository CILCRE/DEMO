<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目展示 · 影像素材合集</title>
<style>
  :root{
    --bg:#07090b;
    --bg-soft:#0e1215;
    --card:#12171b;
    --line:rgba(255,255,255,.09);
    --txt:#eef3f1;
    --dim:#8b9a96;
    --jade:#5fe0a4;
    --jade-dim:#2f8f68;
    --amber:#f0b357;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* 背景光晕 */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(95,224,164,.16), transparent 62%),
      radial-gradient(760px 460px at 92% 4%, rgba(240,179,87,.10), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(95,224,164,.07), transparent 65%);
  }

  /* ---------- 头部 ---------- */
  .hero{
    max-width:1360px; margin:0 auto;
    padding:76px 28px 26px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:9px;
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--jade);
    border:1px solid rgba(95,224,164,.28);
    background:rgba(95,224,164,.06);
    padding:7px 14px; border-radius:999px;
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 12px var(--jade);font-style:normal}
  h1{
    margin:22px 0 0;
    font-size:clamp(34px,5.6vw,62px);
    line-height:1.06;
    letter-spacing:-.02em;
    font-weight:800;
    background:linear-gradient(96deg,#ffffff 4%,#c9f4e2 42%,#7fd9b0 78%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .lede{
    margin:18px 0 0; max-width:640px;
    color:var(--dim); font-size:16px; line-height:1.75;
  }
  .stats{display:flex; flex-wrap:wrap; gap:34px; margin-top:38px}
  .stat b{display:block; font-size:26px; font-weight:700; letter-spacing:-.01em}
  .stat span{font-size:13px; color:var(--dim)}
  .stat b em{font-style:normal; color:var(--jade)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent);margin-top:40px}

  /* ---------- 过滤栏 ---------- */
  .bar{
    position:sticky; top:0; z-index:40;
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    background:rgba(7,9,11,.72);
    border-bottom:1px solid transparent;
    transition:border-color .25s;
  }
  .bar.stuck{border-bottom-color:var(--line)}
  .bar-in{
    max-width:1360px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .chip{
    appearance:none; cursor:pointer;
    font:inherit; font-size:14px;
    color:var(--dim);
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    padding:9px 17px; border-radius:999px;
    transition:.18s;
  }
  .chip:hover{color:var(--txt); border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.06)}
  .chip.on{
    color:#06231a; font-weight:600;
    background:linear-gradient(135deg,var(--jade),#3fc98d);
    border-color:transparent;
    box-shadow:0 6px 22px rgba(95,224,164,.24);
  }
  .bar .hint{margin-left:auto; font-size:12.5px; color:#5f6d69}

  /* ---------- 网格 ---------- */
  main{max-width:1360px; margin:0 auto; padding:34px 28px 90px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    cursor:pointer;
    opacity:0; transform:translateY(16px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1), border-color .25s, box-shadow .25s;
  }
  .card.in{opacity:1; transform:none}
  .card:hover{
    border-color:rgba(95,224,164,.4);
    box-shadow:0 18px 48px -18px rgba(0,0,0,.9), 0 0 0 1px rgba(95,224,164,.12);
  }
  .card.wide{grid-column:span 2}
  @media (max-width:760px){
    .card.wide{grid-column:span 1}
    .grid{grid-template-columns:1fr; gap:16px}
    main{padding:24px 16px 70px}
    .hero{padding:52px 18px 20px}
    .bar-in{padding:12px 16px}
    .bar .hint{display:none}
  }
  .thumb{
    position:relative;
    width:100%; aspect-ratio:16/9;
    background:linear-gradient(135deg,#0d1114,#151b1f);
    overflow:hidden;
  }
  .thumb img,.thumb video{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .7s cubic-bezier(.2,.7,.3,1), opacity .45s ease;
  }
  /* 视频缩略图：解码出画面之前先隐藏，避免露出纯黑方块 */
  .thumb video{
    pointer-events:none;
    background:transparent;
    opacity:0;
  }
  .thumb video.ready{opacity:1}
  .thumb video.fit{object-fit:contain}
  .card:hover .thumb img,.card:hover .thumb video{transform:scale(1.055)}
  .thumb::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top,rgba(5,7,8,.92) 0%,rgba(5,7,8,.28) 42%,transparent 70%);
  }
  .meta{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:16px 17px 15px;
  }
  .meta h3{margin:0; font-size:15.5px; font-weight:650; letter-spacing:.01em}
  .meta p{margin:5px 0 0; font-size:12.5px; color:#9fada9; line-height:1.5}
  .tag{
    display:inline-block; margin-bottom:9px;
    font-size:11px; letter-spacing:.08em;
    color:var(--jade);
    border:1px solid rgba(95,224,164,.32);
    background:rgba(10,26,20,.72);
    padding:3px 9px; border-radius:6px;
  }
  .tag.v{color:var(--amber); border-color:rgba(240,179,87,.34); background:rgba(30,22,8,.72)}
  /* 播放按钮 */
  .play{
    position:absolute; inset:0; z-index:3;
    display:grid; place-items:center;
    pointer-events:none;
  }
  .play span{
    width:62px; height:62px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(8,12,11,.55);
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(6px);
    transition:.25s;
  }
  .play span::before{
    content:""; width:0; height:0; margin-left:4px;
    border-left:17px solid #fff;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
  }
  .card:hover .play span{transform:scale(1.1); background:rgba(95,224,164,.85); border-color:transparent}
  .card:hover .play span::before{border-left-color:#06231a}
  /* 时长角标 */
  .dur{
    position:absolute; top:12px; right:12px; z-index:4;
    font-size:11.5px; letter-spacing:.06em;
    color:#e3ece9; font-variant-numeric:tabular-nums;
    background:rgba(6,9,9,.74);
    border:1px solid rgba(255,255,255,.15);
    padding:3px 8px; border-radius:7px;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .dur[hidden]{display:none}
  /* 解码失败的兜底说明，替代黑块 */
  .fb{
    position:absolute; inset:0; z-index:3;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(135deg,#101619,#182126);
    color:#93a29e; font-size:12.5px; text-align:center; padding:18px;
  }
  .fb b{font-size:14px; color:#cfdad6; font-weight:600}
  .card.failed .fb{display:flex}
  .card.failed .play{display:none}

  /* ---------- 灯箱 ---------- */
  .lb{
    position:fixed; inset:0; z-index:200;
    display:none; place-items:center;
    background:rgba(3,4,5,.94);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .lb.on{display:grid; animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb-stage{
    max-width:min(1500px,94vw);
    max-height:84vh;
    display:flex; align-items:center; justify-content:center;
  }
  .lb-stage img,.lb-stage video{
    max-width:min(1500px,94vw);
    max-height:84vh;
    border-radius:12px;
    box-shadow:0 40px 100px -30px #000;
    background:#000;
    display:block;
  }
  .lb-cap{
    position:fixed; left:0; right:0; bottom:0;
    padding:26px 30px 30px;
    background:linear-gradient(to top,rgba(3,4,5,.96),transparent);
    text-align:center;
    pointer-events:none;
  }
  .lb-cap h4{margin:0; font-size:16px; font-weight:600}
  .lb-cap p{margin:6px 0 0; font-size:13px; color:var(--dim)}
  .lb-cap .idx{margin-top:10px; font-size:12px; color:#61706c; letter-spacing:.14em}
  .lb-cap a{
    pointer-events:auto;
    display:inline-block; margin-top:12px;
    font-size:12.5px; color:var(--jade); text-decoration:none;
    border-bottom:1px solid rgba(95,224,164,.4); padding-bottom:2px;
  }
  .nav{
    position:fixed; top:50%; transform:translateY(-50%);
    width:54px; height:54px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:#fff; font-size:20px; cursor:pointer;
    transition:.2s; user-select:none;
  }
  .nav:hover{background:rgba(95,224,164,.9); color:#06231a; border-color:transparent}
  .nav.prev{left:22px} .nav.next{right:22px}
  .close{
    position:fixed; top:20px; right:24px;
    width:44px; height:44px; border-radius:50%;
    display:grid; place-items:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:#fff; font-size:22px; line-height:1; cursor:pointer;
    transition:.2s;
  }
  .close:hover{background:rgba(255,80,80,.85); border-color:transparent}
  @media (max-width:760px){
    .nav{width:44px;height:44px} .nav.prev{left:8px} .nav.next{right:8px}
    .lb-cap{padding:20px 16px 22px}
  }

  footer{
    border-top:1px solid var(--line);
    padding:30px 28px 44px;
    text-align:center; color:#5f6d69; font-size:12.5px; line-height:1.9;
  }
  footer code{
    font-family:ui-monospace,Consolas,monospace;
    color:#93a5a0; background:rgba(255,255,255,.05);
    padding:2px 6px; border-radius:5px;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow"><i></i>Visual Assets Gallery</div>
  <h1>项目展示 · 影像素材合集</h1>
  <p class="lede">
    3D 渲染静帧、雕塑材质试验与实拍影像的集中展示。点击任意卡片进入大图 / 播放模式，
    支持方向键切换、<kbd>Esc</kbd> 退出。
  </p>
  <div class="stats">
    <div class="stat"><b id="cImg">0</b><span>图片素材</span></div>
    <div class="stat"><b id="cVid">0</b><span>视频片段</span></div>
    <div class="stat"><b>4K<em>·</em>HD</b><span>1920×1080 主力分辨率</span></div>
  </div>
  <div class="rule"></div>
</header>

<div class="bar" id="bar">
  <div class="bar-in">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="image">图片</button>
    <button class="chip" data-f="video">视频</button>
    <span class="hint">← → 切换 · Esc 关闭 · 点击背景退出</span>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  素材目录：<code>Desktop\demo</code> · 本页为单文件静态页面，新增素材只需在 <code>ITEMS</code> 数组中追加一条记录；
  视频缩略图想固定到某一秒，加 <code>thumbAt: 5</code>；想用现成截图则加 <code>poster:"shot.jpg"</code>。
</footer>

<div class="lb" id="lb">
  <div class="close" id="lbClose">×</div>
  <div class="nav prev" id="lbPrev">‹</div>
  <div class="nav next" id="lbNext">›</div>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-cap">
    <h4 id="lbTitle"></h4>
    <p id="lbDesc"></p>
    <div class="idx" id="lbIdx"></div>
    <a id="lbRaw" target="_blank" rel="noopener">查看原文件 ↗</a>
  </div>
</div>

<script>
const ITEMS = [
  { type:"image", src:"fa.png",   ratio:16/9,
    title:"花蕊 · 淡绿", tag:"3D 渲染",
    desc:"放射状花瓣特写，柔光下的浅绿渐变与景深虚化。" },
  { type:"image", src:"fab.png",  ratio:16/9,
    title:"花蕊 · 奶白", tag:"3D 渲染",
    desc:"近景仰角，奶油白花瓣的层次堆叠与倒角高光。" },
  { type:"image", src:"fabv.png", ratio:16/9,
    title:"花蕊 · 米金", tag:"3D 渲染",
    desc:"侧逆光投射，米金色轮廓与右后方花瓣的重叠关系。" },
  { type:"image", src:"f.png",    ratio:16/9,
    title:"花蕊 · 翠绿", tag:"3D 渲染",
    desc:"同构图的深绿版本，用于配色方案对比。" },
  { type:"image", src:"d.png",    ratio:16/9,
    title:"玻璃与花", tag:"3D 渲染",
    desc:"磨砂玻璃板遮挡下的绿色花蕊，检验折射、反射与地面投影。" },
  { type:"image", src:"鹦.png",   ratio:1080/1920,
    title:"雄鹰 · 暖光", tag:"雕塑 · 竖版",
    desc:"深色背景下的老鹰雕塑，暖橘侧光勾勒羽毛层次。" },
  { type:"image", src:"鹦B.png",  ratio:16/9,
    title:"雄鹰 · 翡翠琉璃", tag:"雕塑材质",
    desc:"半透明翡翠琉璃材质，黑色台面上的透光与倒影。" },
  { type:"image", src:"y_00220.jpg", ratio:1920/804, wide:true,
    title:"逆光棕榈", tag:"实拍影像",
    desc:"午后逆光下的棕榈叶片，金橙色透光与冷调天空的冷暖对比。" },
  { type:"video", src:"攻克就业“拦路虎”.mp4",
    title:"攻克就业“拦路虎”", tag:"视频",
    desc:"项目成片，点击播放。" },
  { type:"video", src:"项目展示DEMO剪辑.mp4",
    title:"项目展示 DEMO 剪辑", tag:"视频",
    desc:"演示剪辑版本，点击播放。" }
];

const grid = document.getElementById("grid");
const bar  = document.getElementById("bar");
let view = [];          // 当前筛选后的列表
let at = -1;            // 灯箱索引

/* ---------- 渲染卡片 ---------- */
function render(filter){
  view = ITEMS.filter(it => filter === "all" || it.type === filter);
  grid.innerHTML = view.map((it,i) => {
    const vid = it.type === "video";
    /* 缩略图策略：有 poster 用 poster；没有 poster 就给 src 加媒体片段 #t=1
       让浏览器先定位并解码一帧（而不是停在纯黑的首帧），
       具体取哪一秒由 hydrateVideos() 按片长/thumbAt 再精确 seek。 */
    const media = vid
      ? `<video src="${it.src}${it.poster ? "" : "#t=" + (typeof it.thumbAt === "number" ? it.thumbAt : 1)}"
                ${it.poster ? `poster="${it.poster}"` : ""}
                preload="auto" muted playsinline webkit-playsinline></video>`
      : `<img src="${it.src}" alt="${it.title}" loading="lazy" decoding="async">`;
    return `
    <article class="card${it.wide ? " wide" : ""}${vid ? " vid" : ""}" data-i="${i}">
      <div class="thumb">
        ${media}
        ${vid ? `<div class="play"><span></span></div>
                 <div class="fb"><b>无法预览</b><span>当前浏览器不支持该视频编码</span></div>
                 <div class="dur" hidden></div>` : ""}
      </div>
      <div class="meta">
        <span class="tag${vid ? " v" : ""}">${it.tag}</span>
        <h3>${it.title}</h3>
        <p>${it.desc}</p>
      </div>
    </article>`;
  }).join("");
  observeCards();
  hydrateVideos();
}

/* ---------- 视频缩略图：确保浏览器真的渲染出一帧 ---------- */
function fmtDur(s){
  if(!isFinite(s) || s <= 0) return "";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return `${m}:${String(r).padStart(2, "0")}`;
}

/* 取帧时间：默认落在时长的 12% 处，避开片头黑场与标题卡；
   对某条素材不满意时，可在 ITEMS 里用 thumbAt: 5 指定秒数。 */
function pickTime(it, v){
  const d = (isFinite(v.duration) && v.duration > 0) ? v.duration : 0;
  if(typeof it.thumbAt === "number"){
    return d ? Math.min(it.thumbAt, Math.max(0, d - 0.1)) : it.thumbAt;
  }
  if(!d) return 1;
  return Math.min(Math.max(d * 0.12, 0.8), Math.max(0, d - 0.3));
}

function hydrateVideos(){
  grid.querySelectorAll("video").forEach(v => {
    const card  = v.closest(".card");
    const badge = card && card.querySelector(".dur");
    const it    = card ? view[+card.dataset.i] : null;

    let settled = false;
    const settle = () => {
      if(settled) return;
      settled = true;
      if(!v.paused){ try{ v.pause(); }catch(e){} }
      v.classList.add("ready");
    };
    const setDur = () => {
      if(!badge) return;
      const txt = fmtDur(v.duration);
      if(txt){ badge.textContent = txt; badge.hidden = false; }
    };

    /* 只要拿到可用数据就认为这一帧能画出来 */
    ["loadeddata", "canplay", "playing"].forEach(ev => v.addEventListener(ev, settle));

    /* 依次尝试多个取帧点：某一点没画出画面就换下一个 */
    let marks = null, mi = 0;
    const nextMark = () => {
      if(settled) return;
      if(!marks){
        const d = (isFinite(v.duration) && v.duration > 0) ? v.duration : 0;
        marks = [pickTime(it || {}, v)];
        if(d > 3) marks.push(Math.min(d * 0.35, d - 0.3));
        if(d > 8) marks.push(Math.min(d * 0.65, d - 0.3));
      }
      if(mi >= marks.length) return;
      try { v.currentTime = marks[mi++]; } catch(e){}
    };
    v.addEventListener("seeked", () => {
      if(v.readyState >= 2) settle(); else nextMark();
    });

    v.addEventListener("loadedmetadata", () => {
      setDur();
      /* 竖版视频改用 contain，避免 16:9 卡片把主体裁掉 */
      if(v.videoWidth && v.videoHeight && v.videoWidth / v.videoHeight < 1.1){
        v.classList.add("fit");
      }
      nextMark();
    });

    /* 最后一招：静音播放极短时间，强制解码出一帧后立刻暂停 */
    let kicked = false;
    const kick = () => {
      if(settled || kicked) return;
      kicked = true;
      v.muted = true;
      const p = v.play();
      if(p && p.catch) p.catch(() => {});
      setTimeout(() => { if(v.readyState >= 2) settle(); }, 320);
    };
    v.addEventListener("canplay", kick);
    setTimeout(kick, 2200);

    /* 解码失败（编码不支持等）：标记卡片，露出说明而不是黑块 */
    v.addEventListener("error", () => {
      v.classList.remove("ready");
      if(card) card.classList.add("failed");
    });

    /* 事件已经发生过（缓存命中）时立即补一次 */
    if(v.readyState >= 1){
      setDur();
      if(v.readyState >= 2) settle(); else nextMark();
    }
  });
}

/* ---------- 入场动画 ---------- */
let io;
function observeCards(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es => {
    es.forEach(e => {
      if(e.isIntersecting){
        const el = e.target;
        setTimeout(() => el.classList.add("in"), (el.dataset.i % 6) * 55);
        io.unobserve(el);
      }
    });
  }, { rootMargin:"0px 0px -8% 0px", threshold:.05 });
  grid.querySelectorAll(".card").forEach(c => io.observe(c));
}

/* ---------- 过滤 ---------- */
document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    render(btn.dataset.f);
  });
});

/* ---------- 灯箱 ---------- */
const lb = document.getElementById("lb");
const stage = document.getElementById("lbStage");
const lbTitle = document.getElementById("lbTitle");
const lbDesc  = document.getElementById("lbDesc");
const lbIdx   = document.getElementById("lbIdx");
const lbRaw   = document.getElementById("lbRaw");

function openAt(i){
  if(i < 0 || i >= view.length) return;
  at = i;
  const it = view[i];
  stage.innerHTML = it.type === "image"
    ? `<img src="${it.src}" alt="${it.title}">`
    : `<video src="${it.src}" controls autoplay playsinline></video>`;
  lbTitle.textContent = it.title;
  lbDesc.textContent  = it.desc;
  lbIdx.textContent   = `${i + 1} / ${view.length}   ·   ${it.tag}`;
  lbRaw.href = it.src;
  lbRaw.textContent = it.type === "video" ? "在新窗口打开视频 ↗" : "查看原图 ↗";
  lb.classList.add("on");
  document.body.style.overflow = "hidden";
  if(it.type === "video"){
    const v = stage.querySelector("video");
    v.play().catch(() => {});
  }
}
function closeLb(){
  lb.classList.remove("on");
  stage.innerHTML = "";
  at = -1;
  document.body.style.overflow = "";
}
function step(n){
  if(at < 0) return;
  openAt((at + n + view.length) % view.length);
}

grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if(card) openAt(+card.dataset.i);
});
document.getElementById("lbClose").addEventListener("click", closeLb);
document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
lb.addEventListener("click", e => { if(e.target === lb || e.target === stage) closeLb(); });

document.addEventListener("keydown", e => {
  if(!lb.classList.contains("on")) return;
  if(e.key === "Escape") closeLb();
  if(e.key === "ArrowLeft")  step(-1);
  if(e.key === "ArrowRight") step(1);
  if(e.key === " " && view[at] && view[at].type === "video"){
    e.preventDefault();
    const v = stage.querySelector("video");
    v.paused ? v.play() : v.pause();
  }
});

/* ---------- 顶栏贴顶阴影 ---------- */
addEventListener("scroll", () => {
  bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= 0 && scrollY > 120);
}, { passive:true });

/* ---------- 启动 ---------- */
document.getElementById("cImg").textContent = ITEMS.filter(i => i.type === "image").length;
document.getElementById("cVid").textContent = ITEMS.filter(i => i.type === "video").length;
render("all");
</script>
</body>
</html>
